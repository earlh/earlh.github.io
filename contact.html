    <main class="site-content container article">
<header>
<h1>Contact</h1>
</header>
<section>
<p>Send me a message and I'll get back to you.</p>
<div class="contact-form-wrapper">
<form action="https://formspree.io/f/mzebjkqz" class="formspree-contact-form" method="POST">
<div class="mb-3">
<label class="form-label" for="contact-name">Name</label>
<input class="form-control" id="contact-name" name="name" required type="text">
</div>
<div class="mb-3">
<label class="form-label" for="contact-email">Email</label>
<input class="form-control" id="contact-email" name="email" required type="email">
</div>
<div class="mb-3">
<label class="form-label" for="contact-subject">Subject (optional)</label>
<input class="form-control" id="contact-subject" name="subject" type="text">
</div>
<div class="mb-3">
<label class="form-label" for="contact-message">Message</label>
<textarea class="form-control" id="contact-message" name="message" required rows="3"></textarea>
</div>
<button class="btn btn-primary" type="submit">Send</button>
</form>
</div>

</section>
</main>
